name: Front - Test

on:
  push:
    paths:
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'src/front/**'
      - '.github/workflows/front.yml'
      - '.github/actions/front/**'
      - 'CHANGELOG.md'
      - 'changelog_context.json'
      - 'src/common/**'

defaults:
  run:
    working-directory: src/front

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: src/front/.node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --filter roadkill-reporter...

      - name: Lint common project
        run: |
          cd ../common
          pnpm run lint

      - name: Test
        run: pnpm run test:final
